name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AKS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: rg-firstpass
      AZURE_AKS_NAME: firstpass-aks
      AZURE_ACR_NAME: firstpassacrsd1902
      AZURE_DNS_LABEL: firstpass-chat-sd1902
      AZURE_LOCATION: eastus
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-kubectl@v4

      - name: Build and push image
        run: |
          set -euo pipefail
          image="${AZURE_ACR_NAME}.azurecr.io/firstpass-quotes:${IMAGE_TAG}"
          latest="${AZURE_ACR_NAME}.azurecr.io/firstpass-quotes:latest"
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${AZURE_ACR_NAME}.azurecr.io" --username "${{ secrets.ACR_USERNAME }}" --password-stdin
          docker build --tag "$image" --tag "$latest" .
          docker push "$image"
          docker push "$latest"

      - name: Roll out to the cluster
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          sed "s/REPLACE_ACR/${AZURE_ACR_NAME}/g; s/:latest/:${IMAGE_TAG}/" k8s/deployment.yaml | kubectl apply -f -
          sed "s/REPLACE_DNS_LABEL/${AZURE_DNS_LABEL}/g" k8s/service.yaml | kubectl apply -f -
          kubectl rollout status deployment/firstpass-quotes --timeout=180s

      - name: Apply Grafana and Prometheus
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
            kubectl create secret generic firstpass-grafana \
              --from-literal=admin-user=admin \
              --from-literal=admin-password="${GRAFANA_ADMIN_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          if ! kubectl get secret firstpass-grafana >/dev/null 2>&1; then
            echo "Secret firstpass-grafana is missing. Set GitHub secret GRAFANA_ADMIN_PASSWORD, or apply secrets/firstpass-grafana.yaml. Skipping Grafana so the quote app still ships."
            exit 0
          fi
          grafana_dns="firstpass-grafana-${AZURE_DNS_LABEL#firstpass-chat-}"
          grafana_root="http://${grafana_dns}.${AZURE_LOCATION}.cloudapp.azure.com/"
          kubectl apply -f k8s/metrics-service.yaml
          kubectl apply -f k8s/prometheus.yaml
          kubectl create configmap firstpass-grafana-dashboard \
            --from-file=firstpass.json=k8s/grafana/firstpass.json \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|REPLACE_GRAFANA_DNS|${grafana_dns}|g; s|REPLACE_GRAFANA_ROOT|${grafana_root}|g" k8s/grafana.yaml | kubectl apply -f -
          kubectl rollout status deployment/firstpass-prometheus --timeout=180s
          kubectl rollout status deployment/firstpass-grafana --timeout=180s
          curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors \
            "${grafana_root}api/health"
          echo

      - name: Check public health
        run: |
          set -euo pipefail
          url="http://${AZURE_DNS_LABEL}.${AZURE_LOCATION}.cloudapp.azure.com/api/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$url"
          echo
