state: UT
regulator: Utah Insurance Department
market_notes:
- No-fault auto state. Do not describe the quote as covering all crash-related medical
  bills.
- Wildfire exposure. Do not promise that a property quote has no wildfire deductible
  or exclusion.
disclosures:
- disclosure_id: ut-non-binding
  text: This quote is an estimate and is not a binder or an offer of insurance until
    an application is accepted.
  required_before_quote_acceptance: true
- disclosure_id: ut-licensed
  text: Demo Insurance Co. is appointed in Utah. The Utah Insurance Department regulates
    this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: ut-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: ut-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
- disclosure_id: ut-nofault
  text: Utah is a no-fault auto state. Personal injury protection may be mandatory,
    and this quote does not promise to pay every medical bill from a crash.
  required_before_quote_acceptance: true
prohibited_phrases:
- guaranteed approval
- lowest price guaranteed
- everyone qualifies
- instant binding
- based on your gender
- based on your credit score
