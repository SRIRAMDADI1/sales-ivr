  coverage_limit: $25,000 agreed value
- tier_id: classic-agreed-50
  name: Agreed $50k
  base_premium_monthly: 85.0
  coverage_limit: $50,000 agreed value
- tier_id: classic-agreed-100
  name: Agreed $100k
  base_premium_monthly: 120.0
  coverage_limit: $100,000 agreed value
