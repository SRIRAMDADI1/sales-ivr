apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstpass-quotes
  labels:
    app: firstpass-quotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firstpass-quotes
  template:
    metadata:
      labels:
        app: firstpass-quotes
    spec:
      containers:
        - name: web
          image: REPLACE_ACR.azurecr.io/firstpass-quotes:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SALES_IVR_CONFIG_PATH
              value: /app/config.yaml
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: firstpass-openai
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: firstpass-openai
                  key: AZURE_OPENAI_ENDPOINT
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
