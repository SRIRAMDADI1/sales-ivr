carrier:
  id: "demo-carrier"
  name: "Demo Insurance Co."
  supported_states: ["CA", "TX", "NY", "FL", "IL"]

runtime:
  max_objection_loops: 2
  max_verification_attempts: 2
  after_hours_start: "18:00"
  after_hours_end: "08:00"
  max_agent_tool_rounds: 4

llm:
  # Requires Azure OpenAI. Without a real key/endpoint, the pipeline returns input as output.
  provider: "azure"
  api_key_env: "AZURE_OPENAI_API_KEY"
  endpoint_env: "AZURE_OPENAI_ENDPOINT"
  api_version: "2025-04-01-preview"
  deployment: "gpt-5.4"
  deployment_capable: "gpt-5.4"
  temperature: 0.2
  max_tokens: 1200

paths:
  catalog_dir: "sales_ivr/catalog/products"
  compliance_dir: "sales_ivr/compliance/disclosures"
  objections_dir: "sales_ivr/knowledge/objections"
  fixtures_dir: "sales_ivr/fixtures/sessions"
  crm_path: "sales_ivr/data/crm.json"
