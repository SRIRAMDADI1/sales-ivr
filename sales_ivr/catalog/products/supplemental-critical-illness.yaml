product_id: supplemental-critical-illness
product_line: supplemental
name: Critical Illness Insurance
description: Pays a lump sum on a covered diagnosis such as cancer, heart attack,
  or stroke. It does not pay medical bills as they are incurred.
eligible_states:
- ALL
min_age: 18
required_factors:
- age
- smoker
tiers:
- tier_id: ci-10k
  name: $10,000 Lump Sum
  base_premium_monthly: 24.0
  coverage_limit: $10,000
- tier_id: ci-25k
  name: $25,000 Lump Sum
  base_premium_monthly: 41.0
  coverage_limit: $25,000
- tier_id: ci-50k
  name: $50,000 Lump Sum
  base_premium_monthly: 67.0
  coverage_limit: $50,000
