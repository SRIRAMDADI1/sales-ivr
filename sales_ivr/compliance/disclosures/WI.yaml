state: WI
regulator: Wisconsin Office of the Commissioner of Insurance
market_notes:
- Standardized Medicare supplement is not eligible in this state.
disclosures:
- disclosure_id: wi-non-binding
  text: This quote is an estimate and is not a binder or an offer of insurance until
    an application is accepted.
  required_before_quote_acceptance: true
- disclosure_id: wi-licensed
  text: Demo Insurance Co. is appointed in Wisconsin. The Wisconsin Office of the
    Commissioner of Insurance regulates this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: wi-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: wi-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
- disclosure_id: wi-medigap
  text: Wisconsin does not use the NAIC standardized Medicare supplement plans. This
    carrier's medigap product is not available here.
  required_before_quote_acceptance: true
prohibited_phrases:
- guaranteed approval
- lowest price guaranteed
- everyone qualifies
- instant binding
- based on your gender
- based on your credit score
