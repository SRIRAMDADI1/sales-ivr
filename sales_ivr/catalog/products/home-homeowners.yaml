product_id: home-homeowners
product_line: home
name: Homeowners Insurance
description: Dwelling, other structures, personal property, and liability for a home
  you live in. Flood and earthquake are separate policies. Wind, hail, hurricane,
  and wildfire deductibles may apply.
eligible_states:
- ALL
min_age: 18
required_factors:
- year_built
- roof_age
- deductible
tiers:
- tier_id: home-basic
  name: Basic
  base_premium_monthly: 110.0
  coverage_limit: $250,000 dwelling
- tier_id: home-standard
  name: Standard
  base_premium_monthly: 155.0
  coverage_limit: $400,000 dwelling
- tier_id: home-premium
  name: Premium
  base_premium_monthly: 210.0
  coverage_limit: $600,000 dwelling
