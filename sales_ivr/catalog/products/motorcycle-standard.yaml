product_id: motorcycle-standard
product_line: motorcycle
name: Motorcycle Insurance
description: Liability and physical damage for a street motorcycle. Not an off-road
  ATV or snowmobile policy.
eligible_states:
- ALL
min_age: 21
required_factors:
- driver_age
- bike_year
- annual_mileage
tiers:
- tier_id: moto-basic
  name: Basic
  base_premium_monthly: 45.0
  coverage_limit: 25/50/10
- tier_id: moto-standard
  name: Standard
  base_premium_monthly: 68.0
  coverage_limit: 50/100/25
- tier_id: moto-premium
  name: Premium
  base_premium_monthly: 98.0
  coverage_limit: 100/300/50
