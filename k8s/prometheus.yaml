apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firstpass-prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firstpass-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: firstpass
    scrape_configs:
      - job_name: firstpass-quotes
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - firstpass-quotes-metrics.default.svc.cluster.local
            type: A
            port: 8001
            refresh_interval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstpass-prometheus
  labels:
    app: firstpass-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firstpass-prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: firstpass-prometheus
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: firstpass-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: firstpass-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: firstpass-prometheus
  labels:
    app: firstpass-prometheus
spec:
  type: ClusterIP
  selector:
    app: firstpass-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
