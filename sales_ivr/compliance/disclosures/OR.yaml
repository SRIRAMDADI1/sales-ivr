state: OR
regulator: Oregon Division of Financial Regulation
market_notes:
- PIP may be required. Do not describe the quote as covering all crash-related medical
  bills.
- Wildfire exposure. Do not promise that a property quote has no wildfire deductible
  or exclusion.
disclosures:
- disclosure_id: or-non-binding
  text: This quote is an estimate and is not a binder or an offer of insurance until
    an application is accepted.
  required_before_quote_acceptance: true
- disclosure_id: or-licensed
  text: Demo Insurance Co. is appointed in Oregon. The Oregon Division of Financial
    Regulation regulates this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: or-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: or-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
- disclosure_id: or-pip
  text: Oregon may require or commonly include personal injury protection on an auto
    policy. This quote does not promise to pay every medical bill from a crash.
  required_before_quote_acceptance: true
prohibited_phrases:
- guaranteed approval
- lowest price guaranteed
- everyone qualifies
- instant binding
- based on your gender
- based on your credit score
