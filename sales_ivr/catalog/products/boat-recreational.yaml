product_id: boat-recreational
product_line: boat
name: Recreational Boat Insurance
description: Hull and liability for a recreational boat. Not a personal watercraft
  policy and not a yacht policy.
eligible_states:
- ALL
min_age: 18
required_factors:
- watercraft_length_ft
- engine_hp
- hull_year
tiers:
- tier_id: boat-basic
  name: Basic
  base_premium_monthly: 38.0
  coverage_limit: $50,000 hull
- tier_id: boat-standard
  name: Standard
  base_premium_monthly: 62.0
  coverage_limit: $100,000 hull
- tier_id: boat-premium
  name: Premium
  base_premium_monthly: 110.0
  coverage_limit: $250,000 hull
