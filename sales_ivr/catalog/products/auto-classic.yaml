product_id: auto-classic
product_line: auto
name: Classic Auto Insurance
description: Agreed-value coverage for a collectible private passenger auto, written
  for limited annual mileage. Not a daily-driver personal auto policy.
eligible_states:
- ALL
min_age: 18
required_factors:
- driver_age
- vehicle_year
- annual_mileage
tiers:
- tier_id: classic-agreed-25
