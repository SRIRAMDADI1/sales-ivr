state: CA
regulator: California Department of Insurance
market_notes:
- Wildfire exposure. Do not promise that a property quote has no wildfire deductible
  or exclusion.
- Credit-based insurance scores are restricted for personal auto and home. This quote
  does not use credit.
- Do not describe personal auto rates as based on gender. This rating plan does not
  use gender.
disclosures:
- disclosure_id: ca-rate-notice
  text: Premiums are based on approved rates filed with the California Department
    of Insurance.
  required_before_quote_acceptance: true
- disclosure_id: ca-non-binding
  text: This quote is an estimate and is not a binding offer of insurance.
  required_before_quote_acceptance: true
- disclosure_id: ca-licensed
  text: Demo Insurance Co. is appointed in California. The California Department of
    Insurance regulates this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: ca-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: ca-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
prohibited_phrases:
- guaranteed approval
- lowest price guaranteed
- everyone qualifies
- instant binding
- based on your gender
- based on your credit score
