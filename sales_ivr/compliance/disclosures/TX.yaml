state: TX
regulator: Texas Department of Insurance
market_notes:
- Hurricane and coastal wind exposure. Separate wind deductibles are common.
- Wildfire exposure. Do not promise that a property quote has no wildfire deductible
  or exclusion.
- Hail and tornado are significant property perils. Wind and hail deductibles may
  be separate.
disclosures:
- disclosure_id: tx-availability
  text: Coverage availability and rates may vary based on underwriting guidelines.
  required_before_quote_acceptance: true
- disclosure_id: tx-non-binding
  text: This is a preliminary quote subject to verification.
  required_before_quote_acceptance: true
- disclosure_id: tx-licensed
  text: Demo Insurance Co. is appointed in Texas. The Texas Department of Insurance
    regulates this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: tx-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: tx-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
- disclosure_id: tx-hurricane
  text: Coastal wind and hurricane deductibles are common in Texas. Do not say a property
    quote includes full hurricane coverage.
  required_before_quote_acceptance: true
prohibited_phrases:
- no risk
- everyone qualifies
- guaranteed approval
- lowest price guaranteed
- instant binding
- based on your gender
- based on your credit score
