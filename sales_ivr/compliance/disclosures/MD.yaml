state: MD
regulator: Maryland Insurance Administration
market_notes:
- PIP may be required. Do not describe the quote as covering all crash-related medical
  bills.
- Hurricane and coastal wind exposure. Separate wind deductibles are common.
disclosures:
- disclosure_id: md-non-binding
  text: This quote is an estimate and is not a binder or an offer of insurance until
    an application is accepted.
  required_before_quote_acceptance: true
- disclosure_id: md-licensed
  text: Demo Insurance Co. is appointed in Maryland. The Maryland Insurance Administration
    regulates this transaction. This call may be recorded.
  required_before_quote_acceptance: true
- disclosure_id: md-rating-limits
  text: This estimate does not use credit, gender, or marital status. It is not a
    filed rate and underwriting can change it.
  required_before_quote_acceptance: true
- disclosure_id: md-property-perils
  text: A homeowners, condo, renters, landlord, or mobile-home estimate does not include
    flood or earthquake. Wind, hail, hurricane, and wildfire deductibles can be separate
    when those perils are covered.
  required_before_quote_acceptance: true
- disclosure_id: md-pip
  text: Maryland may require or commonly include personal injury protection on an
    auto policy. This quote does not promise to pay every medical bill from a crash.
  required_before_quote_acceptance: true
- disclosure_id: md-hurricane
  text: Coastal wind and hurricane deductibles are common in Maryland. Do not say
    a property quote includes full hurricane coverage.
  required_before_quote_acceptance: true
prohibited_phrases:
- guaranteed approval
- lowest price guaranteed
- everyone qualifies
- instant binding
- based on your gender
- based on your credit score
